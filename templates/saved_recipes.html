<!DOCTYPE html>
<html>
<head>
  <title>My Wishlist</title>

  <style>
    body {
      font-family: Segoe UI;
      background: #f4f4f9;
      padding: 30px;
      text-align: center;
    }

    .card {
      width: 220px;
      display: inline-block;
      background: white;
      margin: 15px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 10px rgba(0,0,0,0.15);
    }

    .card img {
      width: 100%;
    }

    .card h4 {
      padding: 10px;
      font-size: 16px;
    }

    .card button {
      width: 90%;
      margin: 8px;
      padding: 8px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .view-btn {
      background: #5e1806;
      color: white;
    }

    .delete-btn {
      background: #e60039;
      color: white;
    }

    .back-dashboard {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 18px;
      background: #5e1806;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
  </style>
</head>

<body>

<h2>❤️ My Saved Recipes</h2>

{% if saved_recipes %}
  {% for recipe in saved_recipes %}
    <div class="card">
      <img src="{{ recipe.recipe_thumb }}">
      <h4>{{ recipe.recipe_name }}</h4>

      <a href="{{ recipe.recipe_url }}" target="_blank">
        <button class="view-btn">View Recipe</button>
      </a>

      <form method="POST" action="{{ url_for('delete_recipe') }}">
        <input type="hidden" name="recipe_name" value="{{ recipe.recipe_name }}">
        <button class="delete-btn">Remove</button>
      </form>
    </div>
  {% endfor %}
{% else %}
  <p>No recipes saved yet.</p>
{% endif %}
<button onclick="history.back()" class="back-btn">⬅ Back</button>
</body>
</html>
